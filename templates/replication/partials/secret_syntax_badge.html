{% if info.valid %}
  <div class="flex items-center space-x-1.5 text-[11px] text-emerald-400 font-mono-numbers mt-1">
    <svg class="w-3.5 h-3.5 text-emerald-400 shrink-0" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
    </svg>
    <span><strong>{{ info.type }}</strong>: {{ info.description }} (Strength: {{ info.strength }})</span>
  </div>
{% elif info.type == "Empty" %}
  <div class="text-[11px] text-gray-500 font-mono-numbers mt-1">
    Enter Ed25519 hex (64-char) or exchange API secret. Will be encrypted at rest using AES-256.
  </div>
{% else %}
  <div class="flex items-center space-x-1.5 text-[11px] text-amber-400 font-mono-numbers mt-1">
    <svg class="w-3.5 h-3.5 text-amber-400 shrink-0" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
    </svg>
    <span>{{ info.description }}</span>
  </div>
{% endif %}
